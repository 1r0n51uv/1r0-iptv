<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; }
    .tv-icon-btn { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #9aa0aa; }
    .tv-icon-btn.active { background: #ffb454; color: #14161a; }
    .tv-badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 4px; color: #14161a; }
  </style>
</helmet>
<div style="width:1280px; height:720px; background:#14161a; color:#f2f2f0; display:flex; overflow:hidden;">
  <div style="width:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 0; background:#191c22; border-right:1px solid #262b33;">
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    </div>
    <div class="tv-icon-btn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.35-9.3-8.8C1.2 8 3 5 6.2 5c1.8 0 3.1 1 3.8 2.1C10.7 6 12 5 13.8 5 17 5 18.8 8 17.3 11.2 15 15.65 12 20 12 20z"/></svg>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; gap:22px; padding:30px 40px; overflow:hidden;">
    <div style="font-size:22px; font-weight:700;">Preferiti</div>
    <div style="font-size:14px; color:#6d7380; margin-top:-14px;">Canali, Film e Serie contrassegnati, in un'unica lista</div>
    <div style="display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:18px;">
      <sc-for list="{{items}}" as="card" hint-placeholder-count="8">
        <div onClick="{{card.select}}" style="cursor:pointer; display:flex; flex-direction:column; gap:8px;">
          <div style="{{card.thumbStyle}}">
            <div class="tv-badge" style="background:{{card.badgeColor}}">{{card.badge}}</div>
          </div>
          <div style="font-size:14px; color:#f2f2f0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{card.title}}</div>
          <sc-if value="{{card.subtitle}}" hint-placeholder-val="{{false}}">
            <div style="font-size:12px; color:#9aa0aa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{card.subtitle}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
const ITEMS = [
  { id: 'f1', title: 'Rai 1', subtitle: 'TG1', badge: 'LIVE', badgeColor: '#e0483c' },
  { id: 'f2', title: 'Sky Sport', subtitle: 'Champions League', badge: 'LIVE', badgeColor: '#e0483c' },
  { id: 'f3', title: 'Dune: Parte Due', badge: 'FILM', badgeColor: '#3b82f6' },
  { id: 'f4', title: 'The Bear', subtitle: 'S02', badge: 'SERIE', badgeColor: '#8b5cf6' },
  { id: 'f5', title: 'Rai Sport', subtitle: 'Serie A Live', badge: 'LIVE', badgeColor: '#e0483c' },
  { id: 'f6', title: 'Oppenheimer', badge: 'FILM', badgeColor: '#3b82f6' },
  { id: 'f7', title: 'Slow Horses', subtitle: 'S04', badge: 'SERIE', badgeColor: '#8b5cf6' },
  { id: 'f8', title: 'La7', subtitle: 'Otto e Mezzo', badge: 'LIVE', badgeColor: '#e0483c' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focusedId: 'f1' };
  }
  renderVals() {
    const items = ITEMS.map((item) => {
      const focused = this.state.focusedId === item.id;
      const border = focused ? '3px solid #ffb454' : '3px solid transparent';
      const shadow = focused ? '0 0 0 3px rgba(255,180,84,0.28)' : 'none';
      return {
        ...item,
        thumbStyle: 'position:relative;height:110px;border-radius:8px;background:#262b33;border:' + border + ';box-shadow:' + shadow + ';',
        select: () => this.setState({ focusedId: item.id })
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
