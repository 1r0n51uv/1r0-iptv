<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; }
    .tv-icon-btn { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #9aa0aa; }
    .tv-icon-btn.active { background: #ffb454; color: #14161a; }
    .kbrow { display:flex; gap:8px; }
    .key { width:38px; height:38px; border-radius:6px; background:#1f232a; display:flex; align-items:center; justify-content:center; font-size:14px; color:#d7dae0; border:1px solid #262b33; }
    .tv-badge { position: absolute; top: 7px; left: 7px; font-size: 9px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 6px; border-radius: 4px; color: #14161a; }
  </style>
</helmet>
<div style="width:1280px; height:720px; background:#14161a; color:#f2f2f0; display:flex; overflow:hidden;">
  <div style="width:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 0; background:#191c22; border-right:1px solid #262b33;">
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </div>
    <div class="tv-icon-btn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.35-9.3-8.8C1.2 8 3 5 6.2 5c1.8 0 3.1 1 3.8 2.1C10.7 6 12 5 13.8 5 17 5 18.8 8 17.3 11.2 15 15.65 12 20 12 20z"/></svg>
    </div>
    <div style="flex:1"></div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9c.2.6.7 1.1 1.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </div>
  </div>

  <div style="flex:1; display:flex; gap:32px; padding:30px 40px; overflow:hidden;">
    <div style="width:340px; flex-shrink:0; display:flex; flex-direction:column; gap:22px;">
      <div style="display:flex; align-items:center; gap:10px; background:#1f232a; border:2px solid #ffb454; border-radius:10px; padding:12px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0aa" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input value="{{query}}" onInput="{{onQueryInput}}" placeholder="Cerca canali, film, serie…" style="flex:1; border:none; outline:none; background:transparent; color:#f2f2f0; font-size:16px; font-family:system-ui, sans-serif;" />
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <sc-for list="{{kbRows}}" as="row" hint-placeholder-count="4">
          <div class="kbrow">
            <sc-for list="{{row}}" as="k" hint-placeholder-count="5">
              <div class="key" onClick="{{k.press}}" style="{{k.style}}">{{k.label}}</div>
            </sc-for>
          </div>
        </sc-for>
        <div style="font-size:12px; color:#6d7380; margin-top:4px;">Tastiera virtuale da telecomando (semplificata)</div>
      </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; gap:16px; overflow:hidden;">
      <div style="font-size:15px; color:#9aa0aa;">{{resultsLabel}}</div>
      <div style="display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:16px;">
        <sc-for list="{{results}}" as="card" hint-placeholder-count="6">
          <div onClick="{{card.select}}" style="cursor:pointer; display:flex; flex-direction:column; gap:8px;">
            <div style="{{card.thumbStyle}}">
              <div class="tv-badge" style="background:{{card.badgeColor}}">{{card.badge}}</div>
            </div>
            <div style="font-size:14px; color:#f2f2f0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{card.title}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
const KB_ROWS = [
  ['1', '2', '3', '4', '5'],
  ['Q', 'W', 'E', 'R', 'T'],
  ['A', 'S', 'D', 'F', 'G'],
  ['Z', 'X', 'C', 'V', '⌫']
];
const ITEMS = [
  { id: 's1', title: 'Rai 1', badge: 'LIVE', badgeColor: '#e0483c' },
  { id: 's2', title: 'Sky Sport Calcio', badge: 'LIVE', badgeColor: '#e0483c' },
  { id: 's3', title: 'Rai Sport', badge: 'LIVE', badgeColor: '#e0483c' },
  { id: 's4', title: 'Dune: Parte Due', badge: 'FILM', badgeColor: '#3b82f6' },
  { id: 's5', title: 'Oppenheimer', badge: 'FILM', badgeColor: '#3b82f6' },
  { id: 's6', title: 'The Bear', badge: 'SERIE', badgeColor: '#8b5cf6' },
  { id: 's7', title: 'Slow Horses', badge: 'SERIE', badgeColor: '#8b5cf6' },
  { id: 's8', title: 'Canale 5', badge: 'LIVE', badgeColor: '#e0483c' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '', selectedId: null };
  }
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const filtered = q ? ITEMS.filter((i) => i.title.toLowerCase().includes(q)) : ITEMS;
    const results = filtered.map((item) => {
      const selected = this.state.selectedId === item.id;
      const border = selected ? '3px solid #ffb454' : '3px solid transparent';
      return {
        ...item,
        thumbStyle: 'position:relative;height:110px;border-radius:8px;background:#262b33;border:' + border + ';',
        select: () => this.setState({ selectedId: item.id })
      };
    });
    const kbRows = KB_ROWS.map((row) =>
      row.map((label) => ({
        label,
        style: label === '⌫' ? 'color:#ffb454;' : '',
        press: () => {
          if (label === '⌫') {
            this.setState({ query: this.state.query.slice(0, -1) });
          } else {
            this.setState({ query: this.state.query + label });
          }
        }
      }))
    );
    return {
      query: this.state.query,
      onQueryInput: (e) => this.setState({ query: e.target.value }),
      results,
      resultsLabel: q ? results.length + ' risultati per "' + this.state.query + '"' : 'Suggeriti',
      kbRows
    };
  }
}
</script>
</body>
</html>
