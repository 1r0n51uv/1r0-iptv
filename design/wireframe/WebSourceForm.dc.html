<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f4; }
    a { color: #b45309; } a:hover { color: #92400e; }
    .tab { padding:8px 4px; font-size:14px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
    .tab.active { color:#b45309; border-bottom-color:#b45309; }
    .field-label { font-size:13px; font-weight:600; color:#3a3a36; margin-bottom:6px; }
    .field-input { width:100%; padding:10px 12px; border-radius:7px; border:1px solid #d9d9d5; font-size:14px; color:#1c1c1a; background:#fff; }
    .field-input:focus { outline:2px solid #b45309; outline-offset:1px; }
    .type-opt { flex:1; padding:14px; border-radius:9px; border:2px solid #e5e5e2; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
    .type-opt.active { border-color:#b45309; background:#fdf3ea; }
    .btn { padding:10px 18px; border-radius:7px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-primary { background:#b45309; color:#fff; }
    .btn-ghost { background:#fff; color:#1c1c1a; border:1px solid #d9d9d5; }
  </style>
</helmet>
<div style="width:1200px; min-height:820px; background:#f5f5f4; color:#1c1c1a; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:1px solid #e5e5e2; background:#fff;">
    <div style="display:flex; align-items:center; gap:28px;">
      <div style="font-size:16px; font-weight:700;">1r0 IPTV · Pannello Web</div>
      <div style="display:flex; gap:22px;">
        <div class="tab active">Sorgenti</div>
        <div class="tab">Contenuti</div>
      </div>
    </div>
  </div>

  <div style="padding:28px 32px; display:flex; justify-content:center;">
    <div style="width:560px; display:flex; flex-direction:column; gap:22px;">
      <div>
        <div style="font-size:20px; font-weight:700;">Aggiungi Sorgente</div>
        <div style="font-size:13px; color:#6b6b66; margin-top:2px;">Playlist M3U o account Xtream Codes</div>
      </div>

      <div style="display:flex; gap:14px;">
        <div class="type-opt {{m3uActiveClass}}" onClick="{{selectM3u}}">
          <div style="font-weight:700; font-size:14px;">Playlist M3U</div>
          <div style="font-size:12px; color:#6b6b66;">Un link a un file .m3u / .m3u8</div>
        </div>
        <div class="type-opt {{xtreamActiveClass}}" onClick="{{selectXtream}}">
          <div style="font-weight:700; font-size:14px;">Xtream Codes</div>
          <div style="font-size:12px; color:#6b6b66;">Host, username e password del provider</div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <div class="field-label">Nome Sorgente</div>
          <input class="field-input" placeholder="es. Provider Principale" />
        </div>

        <sc-if value="{{isM3u}}" hint-placeholder-val="{{true}}">
          <div>
            <div class="field-label">URL Playlist</div>
            <input class="field-input" placeholder="https://esempio.tv/lista.m3u8" />
          </div>
        </sc-if>

        <sc-if value="{{isXtream}}" hint-placeholder-val="{{false}}">
          <div style="display:flex; flex-direction:column; gap:16px;">
            <div>
              <div class="field-label">Host</div>
              <input class="field-input" placeholder="iptv.provider.example" />
            </div>
            <div style="display:flex; gap:14px;">
              <div style="flex:1;">
                <div class="field-label">Porta</div>
                <input class="field-input" placeholder="8080" />
              </div>
              <div style="flex:2;">
                <div class="field-label">Username</div>
                <input class="field-input" placeholder="username" />
              </div>
            </div>
            <div>
              <div class="field-label">Password</div>
              <input class="field-input" type="password" placeholder="••••••••" />
            </div>
          </div>
        </sc-if>
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:6px;">
        <div class="btn btn-ghost">Annulla</div>
        <div class="btn btn-primary">Salva Sorgente</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'xtream' };
  }
  renderVals() {
    const isM3u = this.state.type === 'm3u';
    return {
      isM3u,
      isXtream: !isM3u,
      m3uActiveClass: isM3u ? 'active' : '',
      xtreamActiveClass: !isM3u ? 'active' : '',
      selectM3u: () => this.setState({ type: 'm3u' }),
      selectXtream: () => this.setState({ type: 'xtream' })
    };
  }
}
</script>
</body>
</html>
