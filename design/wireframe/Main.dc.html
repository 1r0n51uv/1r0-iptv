<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; }
    .tv-icon-btn { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #9aa0aa; }
    .tv-icon-btn.active { background: #ffb454; color: #14161a; }
    .tv-row-title { font-size: 20px; font-weight: 600; color: #f2f2f0; margin: 0; }
    .tv-badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 4px; color: #14161a; }
    .tv-card-title { font-size: 15px; color: #f2f2f0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-card-sub { font-size: 13px; color: #9aa0aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</helmet>
<div style="width:1280px; height:720px; background:#14161a; color:#f2f2f0; display:flex; overflow:hidden;">

  <div style="width:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 0; background:#191c22; border-right:1px solid #262b33;">
    <div class="tv-icon-btn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.35-9.3-8.8C1.2 8 3 5 6.2 5c1.8 0 3.1 1 3.8 2.1C10.7 6 12 5 13.8 5 17 5 18.8 8 17.3 11.2 15 15.65 12 20 12 20z"/></svg>
    </div>
    <div style="flex:1"></div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9c.2.6.7 1.1 1.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; gap:30px; padding:30px 40px; overflow:hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:22px; font-weight:700; letter-spacing:0.01em;">1r0 IPTV</div>
      <div style="font-size:15px; color:#9aa0aa;">20:45</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <p class="tv-row-title">Preferiti</p>
      <div style="display:flex; gap:16px;">
        <sc-for list="{{favoriti}}" as="card" hint-placeholder-count="4">
          <div onClick="{{card.select}}" style="width:220px; cursor:pointer; display:flex; flex-direction:column; gap:8px;">
            <div style="{{card.thumbStyle}}">
              <div class="tv-badge" style="background:{{card.badgeColor}}">{{card.badge}}</div>
              <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#4a505c;">
                <sc-if value="{{card.isLive}}" hint-placeholder-val="{{true}}">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 3l4 3 4-3"/></svg>
                </sc-if>
                <sc-if value="{{card.isVod}}" hint-placeholder-val="{{false}}">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 16h18M9 3v18"/></svg>
                </sc-if>
              </div>
              <sc-if value="{{card.isLive}}" hint-placeholder-val="{{true}}">
                <div style="font-size:11px; color:#d7dae0; background:rgba(0,0,0,0.45); padding:4px 6px; border-radius:4px;">In onda: {{card.subtitle}}</div>
              </sc-if>
            </div>
            <div class="tv-card-title">{{card.title}}</div>
            <sc-if value="{{card.showSub}}" hint-placeholder-val="{{false}}">
              <div class="tv-card-sub">{{card.subtitle}}</div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <p class="tv-row-title">In onda ora</p>
      <div style="display:flex; gap:16px;">
        <sc-for list="{{liveOra}}" as="card" hint-placeholder-count="5">
          <div onClick="{{card.select}}" style="width:220px; cursor:pointer; display:flex; flex-direction:column; gap:8px;">
            <div style="{{card.thumbStyle}}">
              <div class="tv-badge" style="background:{{card.badgeColor}}">{{card.badge}}</div>
              <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#4a505c;">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 3l4 3 4-3"/></svg>
              </div>
              <div style="font-size:11px; color:#d7dae0; background:rgba(0,0,0,0.45); padding:4px 6px; border-radius:4px;">In onda: {{card.subtitle}}</div>
            </div>
            <div class="tv-card-title">{{card.title}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <p class="tv-row-title">Film</p>
      <div style="display:flex; gap:16px;">
        <sc-for list="{{film}}" as="card" hint-placeholder-count="5">
          <div onClick="{{card.select}}" style="width:220px; cursor:pointer; display:flex; flex-direction:column; gap:8px;">
            <div style="{{card.thumbStyle}}">
              <div class="tv-badge" style="background:{{card.badgeColor}}">{{card.badge}}</div>
              <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#4a505c;">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 16h18M9 3v18"/></svg>
              </div>
            </div>
            <div class="tv-card-title">{{card.title}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <p class="tv-row-title">Serie</p>
      <div style="display:flex; gap:16px;">
        <sc-for list="{{serie}}" as="card" hint-placeholder-count="5">
          <div onClick="{{card.select}}" style="width:220px; cursor:pointer; display:flex; flex-direction:column; gap:8px;">
            <div style="{{card.thumbStyle}}">
              <div class="tv-badge" style="background:{{card.badgeColor}}">{{card.badge}}</div>
              <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#4a505c;">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h18M3 16h18"/></svg>
              </div>
            </div>
            <div class="tv-card-title">{{card.title}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focusedId: 'fav-1' };
  }
  makeCard(item) {
    const focused = this.state.focusedId === item.id;
    const border = focused ? '3px solid #ffb454' : '3px solid transparent';
    const shadow = focused ? '0 0 0 3px rgba(255,180,84,0.28)' : 'none';
    const scale = focused ? 'scale(1.045)' : 'scale(1)';
    return {
      ...item,
      thumbStyle: 'position:relative;height:124px;border-radius:8px;background:#262b33;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:' + border + ';box-shadow:' + shadow + ';transform:' + scale + ';transition:all 120ms ease;',
      select: () => this.setState({ focusedId: item.id })
    };
  }
  renderVals() {
    const favoriti = [
      { id: 'fav-1', title: 'Rai 1', subtitle: 'TG1', badge: 'LIVE', badgeColor: '#e0483c', isLive: true },
      { id: 'fav-2', title: 'Sky Sport', subtitle: 'Champions League', badge: 'LIVE', badgeColor: '#e0483c', isLive: true },
      { id: 'fav-3', title: 'Dune: Parte Due', badge: 'FILM', badgeColor: '#3b82f6', isVod: true },
      { id: 'fav-4', title: 'The Bear', subtitle: 'S02', badge: 'SERIE', badgeColor: '#8b5cf6', isVod: true, showSub: true }
    ].map((c) => this.makeCard(c));
    const liveOra = [
      { id: 'live-1', title: 'Rai 2', subtitle: 'Blob', badge: 'LIVE', badgeColor: '#e0483c' },
      { id: 'live-2', title: 'Canale 5', subtitle: 'Striscia la Notizia', badge: 'LIVE', badgeColor: '#e0483c' },
      { id: 'live-3', title: 'Rai Sport', subtitle: 'Serie A Live', badge: 'LIVE', badgeColor: '#e0483c' },
      { id: 'live-4', title: 'La7', subtitle: "Otto e Mezzo", badge: 'LIVE', badgeColor: '#e0483c' },
      { id: 'live-5', title: 'Italia 1', subtitle: 'Le Iene', badge: 'LIVE', badgeColor: '#e0483c' }
    ].map((c) => this.makeCard(c));
    const film = [
      { id: 'film-1', title: 'Oppenheimer', badge: 'FILM', badgeColor: '#3b82f6' },
      { id: 'film-2', title: 'Povere Creature!', badge: 'FILM', badgeColor: '#3b82f6' },
      { id: 'film-3', title: 'Past Lives', badge: 'FILM', badgeColor: '#3b82f6' },
      { id: 'film-4', title: 'Anatomia di una Caduta', badge: 'FILM', badgeColor: '#3b82f6' },
      { id: 'film-5', title: 'La Zona d’Interesse', badge: 'FILM', badgeColor: '#3b82f6' }
    ].map((c) => this.makeCard(c));
    const serie = [
      { id: 'serie-1', title: 'The Bear', badge: 'SERIE', badgeColor: '#8b5cf6' },
      { id: 'serie-2', title: 'Slow Horses', badge: 'SERIE', badgeColor: '#8b5cf6' },
      { id: 'serie-3', title: 'Shogun', badge: 'SERIE', badgeColor: '#8b5cf6' },
      { id: 'serie-4', title: 'Fargo', badge: 'SERIE', badgeColor: '#8b5cf6' },
      { id: 'serie-5', title: "C'è ancora domani", badge: 'SERIE', badgeColor: '#8b5cf6' }
    ].map((c) => this.makeCard(c));
    return { favoriti, liveOra, film, serie };
  }
}
</script>
</body>
</html>
