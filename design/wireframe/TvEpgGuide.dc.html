<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; }
    .tv-icon-btn { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #9aa0aa; }
    .tv-icon-btn.active { background: #ffb454; color: #14161a; }
    .epg-row { display:flex; align-items:stretch; height:64px; border-bottom:1px solid #22262e; }
    .epg-chlabel { width:160px; flex-shrink:0; display:flex; align-items:center; font-size:14px; font-weight:600; color:#f2f2f0; padding-left:4px; }
    .epg-seg { display:flex; flex-direction:column; justify-content:center; padding:0 10px; border-right:1px solid #14161a; overflow:hidden; cursor:pointer; }
    .epg-title { font-size:13px; font-weight:500; color:#e3e5e9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .epg-time { font-size:11px; color:#7d838f; }
  </style>
</helmet>
<div style="width:1280px; height:720px; background:#14161a; color:#f2f2f0; display:flex; overflow:hidden;">
  <div style="width:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 0; background:#191c22; border-right:1px solid #262b33;">
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="tv-icon-btn active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    </div>
    <div class="tv-icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.35-9.3-8.8C1.2 8 3 5 6.2 5c1.8 0 3.1 1 3.8 2.1C10.7 6 12 5 13.8 5 17 5 18.8 8 17.3 11.2 15 15.65 12 20 12 20z"/></svg>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; gap:18px; padding:30px 40px; overflow:hidden;">
    <div style="font-size:22px; font-weight:700;">Guida TV</div>

    <div style="position:relative; border:1px solid #262b33; border-radius:8px; overflow:hidden;">
      <div style="display:flex; background:#191c22; border-bottom:1px solid #262b33;">
        <div style="width:160px; flex-shrink:0;"></div>
        <div style="width:120px; flex-shrink:0; padding:8px 10px; font-size:12px; color:#9aa0aa;">20:00</div>
        <div style="width:120px; flex-shrink:0; padding:8px 10px; font-size:12px; color:#9aa0aa;">20:30</div>
        <div style="width:120px; flex-shrink:0; padding:8px 10px; font-size:12px; color:#9aa0aa;">21:00</div>
        <div style="width:120px; flex-shrink:0; padding:8px 10px; font-size:12px; color:#9aa0aa;">21:30</div>
        <div style="width:120px; flex-shrink:0; padding:8px 10px; font-size:12px; color:#9aa0aa;">22:00</div>
        <div style="width:120px; flex-shrink:0; padding:8px 10px; font-size:12px; color:#9aa0aa;">22:30</div>
      </div>

      <div style="position:absolute; top:40px; bottom:0; left:390px; width:2px; background:#ffb454; z-index:2;"></div>

      <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
        <div class="epg-row">
          <div class="epg-chlabel">{{row.name}}</div>
          <sc-for list="{{row.segs}}" as="seg" hint-placeholder-count="3">
            <div onClick="{{seg.select}}" class="epg-seg" style="{{seg.style}}">
              <div class="epg-title">{{seg.title}}</div>
              <div class="epg-time">{{seg.time}}</div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="font-size:12px; color:#6d7380;">La linea verticale indica l'orario corrente. Seleziona un programma per vedere i dettagli.</div>
  </div>
</div>
</x-dc>
<script data-dc-script>
const CHANNELS = [
  { id: 'rai1', name: 'Rai 1', segs: [
    { key: 'rai1-1', title: 'TG1', time: '20:00–20:30', w: 120 },
    { key: 'rai1-2', title: 'Il Commissario Ricciardi', time: '20:30–22:00', w: 360, current: true },
    { key: 'rai1-3', title: 'Porta a Porta', time: '22:00–23:00', w: 240 }
  ]},
  { id: 'rai2', name: 'Rai 2', segs: [
    { key: 'rai2-1', title: 'Blob', time: '20:00–20:30', w: 120 },
    { key: 'rai2-2', title: 'Che Tempo Che Fa', time: '20:30–22:00', w: 360, current: true },
    { key: 'rai2-3', title: 'N.C.I.S.', time: '22:00–23:00', w: 240 }
  ]},
  { id: 'c5', name: 'Canale 5', segs: [
    { key: 'c5-1', title: 'Striscia la Notizia', time: '20:00–20:30', w: 120 },
    { key: 'c5-2', title: 'Grande Fratello', time: '20:30–22:00', w: 360, current: true },
    { key: 'c5-3', title: 'Tg5 Notte', time: '22:00–23:00', w: 240 }
  ]},
  { id: 'sky', name: 'Sky Sport', segs: [
    { key: 'sky-1', title: 'Champions League Live', time: '20:00–22:00', w: 480, current: true },
    { key: 'sky-2', title: 'Sky Calcio Show', time: '22:00–23:00', w: 240 }
  ]},
  { id: 'la7', name: 'La7', segs: [
    { key: 'la7-1', title: 'Otto e Mezzo', time: '20:00–20:30', w: 120 },
    { key: 'la7-2', title: 'Atlantide', time: '20:30–22:00', w: 360, current: true },
    { key: 'la7-3', title: 'TgLa7', time: '22:00–23:00', w: 240 }
  ]}
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selectedKey: 'sky-1' };
  }
  renderVals() {
    const rows = CHANNELS.map((ch) => ({
      name: ch.name,
      segs: ch.segs.map((seg) => {
        const selected = this.state.selectedKey === seg.key;
        let bg = '#1c1f26';
        if (seg.current) bg = '#2a2415';
        if (selected) bg = '#3a2e12';
        const border = selected ? '2px solid #ffb454' : (seg.current ? '2px solid #6b5320' : '2px solid transparent');
        return {
          ...seg,
          style: 'width:' + seg.w + 'px;background:' + bg + ';border-top:' + border + ';border-bottom:' + border + ';',
          select: () => this.setState({ selectedKey: seg.key })
        };
      })
    }));
    return { rows };
  }
}
</script>
</body>
</html>
