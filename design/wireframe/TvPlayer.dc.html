<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #000; }
    .ctrl-btn { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.12); color:#f2f2f0; cursor:pointer; }
    .pill-btn { padding:8px 14px; border-radius:20px; background:rgba(255,255,255,0.12); color:#f2f2f0; font-size:12px; font-weight:600; cursor:pointer; }
  </style>
</helmet>
<div style="width:1280px; height:720px; background:#000; color:#f2f2f0; position:relative; overflow:hidden;">

  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#3a3a3a;">
    <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
  </div>

  <div style="position:absolute; top:22px; right:22px;">
    <div class="pill-btn" onClick="{{toggleMode}}">Modalità: {{modeLabel}} (cambia)</div>
  </div>

  <sc-if value="{{controlsVisible}}" hint-placeholder-val="{{true}}">
  <div style="position:absolute; inset:0;">
    <div style="position:absolute; top:0; left:0; right:0; padding:22px 30px; display:flex; align-items:center; gap:16px; background:linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);">
      <div class="ctrl-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div style="font-size:16px; font-weight:600;">{{headerTitle}}</div>
    </div>

    <div style="position:absolute; bottom:0; left:0; right:0; padding:24px 30px 30px; display:flex; flex-direction:column; gap:14px; background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);">

      <sc-if value="{{isVod}}" hint-placeholder-val="{{true}}">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:#c7cad0;">
            <span>18:24</span>
            <div style="flex:1; height:4px; background:rgba(255,255,255,0.22); border-radius:2px; position:relative;">
              <div style="position:absolute; left:0; top:0; bottom:0; width:62%; background:#ffb454; border-radius:2px;"></div>
              <div style="position:absolute; left:62%; top:50%; width:12px; height:12px; margin-left:-6px; margin-top:-6px; background:#ffb454; border-radius:50%;"></div>
            </div>
            <span>29:40</span>
          </div>
          <div style="display:flex; align-items:center; gap:18px;">
            <div class="ctrl-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h3v12H6zM17 6l-9 6 9 6z"/></svg></div>
            <div class="ctrl-btn" onClick="{{togglePlay}}">
              <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
              </sc-if>
              <sc-if value="{{notPlaying}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </sc-if>
            </div>
            <div class="ctrl-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 6h-3v12h3zM7 6l9 6-9 6z"/></svg></div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isLive}}" hint-placeholder-val="{{false}}">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:24px;">
          <div>
            <div style="font-size:12px; color:#ffb454; font-weight:700; letter-spacing:0.04em;">IN ONDA ORA</div>
            <div style="font-size:16px; font-weight:600;">Champions League Live</div>
            <div style="font-size:12px; color:#9aa0aa;">20:00–22:00 · Sky Sport</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:12px; color:#7d838f; font-weight:700; letter-spacing:0.04em;">A SEGUIRE</div>
            <div style="font-size:14px; font-weight:600; color:#e3e5e9;">Sky Calcio Show</div>
            <div style="font-size:12px; color:#9aa0aa;">22:00–23:00</div>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
  </sc-if>

  <div style="position:absolute; bottom:14px; left:50%; transform:translateX(-50%);">
    <div class="pill-btn" onClick="{{toggleControls}}">{{controlsToggleLabel}}</div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'vod', playing: true, controlsVisible: true };
  }
  renderVals() {
    const isVod = this.state.mode === 'vod';
    return {
      isVod,
      isLive: !isVod,
      modeLabel: isVod ? 'Film/Serie' : 'Live TV',
      headerTitle: isVod ? 'The Bear · S02E04 · Fondo Ammortizzatore' : 'Sky Sport',
      toggleMode: () => this.setState({ mode: isVod ? 'live' : 'vod' }),
      playing: this.state.playing,
      notPlaying: !this.state.playing,
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      controlsVisible: this.state.controlsVisible,
      controlsToggleLabel: this.state.controlsVisible ? 'Nascondi controlli (dopo inattività)' : 'Mostra controlli',
      toggleControls: () => this.setState({ controlsVisible: !this.state.controlsVisible })
    };
  }
}
</script>
</body>
</html>
